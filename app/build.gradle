plugins {
    id 'com.android.application'
}

android {
    namespace 'me.vladimir.assistrelay'
    compileSdk 35

    defaultConfig {
        applicationId 'me.vladimir.assistrelay2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подпись debug-ключом, чтобы APK из CI можно было сразу установить
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
